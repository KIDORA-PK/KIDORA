<script>

/* =========================================================

const PRODUCTS = [

    {

        name: "Pink Princess Frock",

        image:

    },


    {

        image:
            "https://images.unsplash.com/photo-1599623560574-39d485900c95?auto=format&fit=crop&w=1200&q=85",

        price1Y: 850,

        price2Y: 900
    },


    {
        id: 5,

        name: "Princess Party Outfit",

        color: "Blush Pink",

        description:
            "A beautiful princess-style outfit for birthdays, celebrations and memorable family occasions.",

        image:
            "https://images.unsplash.com/photo-1543087903-1acb3ecf2e68?auto=format&fit=crop&w=1200&q=85",

        price1Y: 950,

        price2Y: 1000
    }

];


/* =========================================================
   WHATSAPP NUMBER

   CHANGE THIS IF NEEDED
========================================================= */

const WHATSAPP_NUMBER = "923469030193";


/* =========================================================
   CART
========================================================= */

let cart = [];


/* =========================================================
   CURRENT PRODUCT
========================================================= */

let currentProduct = null;

let selectedSize = "1Y";

let selectedQuantity = 1;


/* =========================================================
   DAILY DISCOUNT SYSTEM
=========================================================

   IMPORTANT:

   This system DOES NOT use localStorage.

   Instead, the discount is generated from
   today's Pakistan date.

   Therefore:

   Customer A = same discount
   Customer B = same discount
   Customer C = same discount

   Everyone sees the same daily offer.

========================================================= */


/* Get today's date in Pakistan */

function getPakistanDate() {

    const parts =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone: "Asia/Karachi",

                year: "numeric",

                month: "2-digit",

                day: "2-digit"
            }
        ).formatToParts(new Date());


    let year = "";
    let month = "";
    let day = "";


    parts.forEach(part => {

        if (part.type === "year") {
            year = part.value;
        }

        if (part.type === "month") {
            month = part.value;
        }

        if (part.type === "day") {
            day = part.value;
        }

    });


    return `${year}-${month}-${day}`;

}


/* Convert date into a number */

function dateSeed(dateString) {

    let hash = 0;


    for (let i = 0; i < dateString.length; i++) {

        hash =
            (
                hash * 31 +
                dateString.charCodeAt(i)
            ) >>> 0;

    }


    return hash;

}


/* =========================================================
   CREATE DAILY DISCOUNTS
========================================================= */

function createDailyDiscounts() {

    const date =
        getPakistanDate();


    const seed =
        dateSeed(date);


    /*
       Start with every product at 5%.

       This guarantees that at least one product
       always has a 5% discount.
    */

    const discounts =
        PRODUCTS.map(() => 5);


    /*
       Pick one product for 10%.
    */

    const tenIndex =
        seed % PRODUCTS.length;


    discounts[tenIndex] = 10;


    /*
       Pick another product for 15%.

       We use a different calculation so it
       normally doesn't choose the same product.
    */

    let fifteenIndex =
        Math.floor(seed / 7) % PRODUCTS.length;


    if (fifteenIndex === tenIndex) {

        fifteenIndex =
            (fifteenIndex + 1) %
            PRODUCTS.length;

    }


    discounts[fifteenIndex] = 15;


    /*
       Return object:

       {
           1: 5,
           2: 10,
           3: 5,
           4: 15,
           5: 5
       }

       The exact result changes automatically
       when Pakistan's date changes.
    */

    const result = {};


    PRODUCTS.forEach((product, index) => {

        result[product.id] =
            discounts[index];

    });


    return result;

}


/* Generate today's discounts */

const DAILY_DISCOUNTS =
    createDailyDiscounts();


/* Get product discount */

function getDiscount(product) {

    return DAILY_DISCOUNTS[product.id] || 0;

}


/* =========================================================
   CALCULATE SALE PRICE
========================================================= */

function getSalePrice(basePrice, discount) {

    return Math.round(
        basePrice *
        (1 - discount / 100)
    );

}


/* =========================================================
   CALCULATE SAVING
========================================================= */

function getSaving(basePrice, discount) {

    return basePrice -
        getSalePrice(
            basePrice,
            discount
        );

}


/* =========================================================
   SHOW PRODUCTS
========================================================= */

function renderProducts() {

    const grid =
        document.getElementById(
            "productsGrid"
        );


    grid.innerHTML = "";


    PRODUCTS.forEach(product => {

        const discount =
            getDiscount(product);


        const salePrice =
            getSalePrice(
                product.price1Y,
                discount
            );


        const oldPrice =
            product.price1Y;


        const card =
            document.createElement("div");


        card.className =
            "product-card";


        card.onclick = () => {

            openProduct(product.id);

        };


        card.innerHTML = `

            <div class="product-image">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >

                <div class="discount-badge">
                    ${discount}% OFF
                </div>

            </div>


            <div class="product-info">

                <h3>
                    ${product.name}
                </h3>

                <div class="product-color">
                    ${product.color}
                </div>


                <div class="price-row">

                    <span class="old-price">
                        Rs. ${oldPrice}
                    </span>

                    <span class="sale-price">
                        Rs. ${salePrice}
                    </span>

                </div>

            </div>

        `;


        grid.appendChild(card);

    });

}


/* =========================================================
   OPEN PRODUCT PAGE
========================================================= */

function openProduct(productId) {

    currentProduct =
        PRODUCTS.find(
            product =>
                product.id === productId
        );


    if (!currentProduct) {
        return;
    }


    selectedSize = "1Y";

    selectedQuantity = 1;


    renderProductPage();


    document
        .getElementById("homePage")
        .style.display = "none";


    document
        .getElementById("productPage")
        .classList.add("active");


    window.scrollTo(0, 0);


    /*
       Add browser history.

       This means the normal browser
       back button works too.
    */

    history.pushState(
        {
            product: productId
        },
        "",
        "#product-" + productId
    );

}


/* =========================================================
   RENDER FULL PRODUCT PAGE
========================================================= */

function renderProductPage() {

    const container =
        document.getElementById(
            "productDetail"
        );


    const discount =
        getDiscount(currentProduct);


    const price1 =
        getSalePrice(
            currentProduct.price1Y,
            discount
        );


    const price2 =
        getSalePrice(
            currentProduct.price2Y,
            discount
        );


    const saving1 =
        getSaving(
            currentProduct.price1Y,
            discount
        );


    const saving2 =
        getSaving(
            currentProduct.price2Y,
            discount
        );


    const selectedBasePrice =
        selectedSize === "1Y"
            ? currentProduct.price1Y
            : currentProduct.price2Y;


    const selectedSalePrice =
        selectedSize === "1Y"
            ? price1
            : price2;


    const selectedSaving =
        selectedSize === "1Y"
            ? saving1
            : saving2;


    container.innerHTML = `

        <div class="detail-image">

            <img
                src="${currentProduct.image}"
                alt="${currentProduct.name}"
            >

        </div>


        <div class="detail-info">

            <h1>
                ${currentProduct.name}
            </h1>


            <div class="detail-color">
                Color: ${currentProduct.color}
            </div>


            <p class="detail-description">
                ${currentProduct.description}
            </p>


            <div class="detail-price">

                <span class="detail-old-price">
                    Rs. ${selectedBasePrice}
                </span>

                <span class="detail-sale-price">
                    Rs. ${selectedSalePrice}
                </span>

                <span class="detail-discount">
                    ${discount}% OFF
                </span>

            </div>


            <p
                style="
                    color:#e27698;
                    font-weight:700;
                    margin-bottom:25px;
                "
            >
                You save Rs. ${selectedSaving}
            </p>


            <div class="option-title">
                Select Size
            </div>


            <div class="size-options">

                <button
                    class="
                        size-button
                        ${selectedSize === "1Y" ? "active" : ""}
                    "
                    onclick="selectSize('1Y')"
                >
                    1Y Baby Dress
                    <br>
                    Rs. ${price1}
                </button>


                <button
                    class="
                        size-button
                        ${selectedSize === "2Y" ? "active" : ""}
                    "
                    onclick="selectSize('2Y')"
                >
                    2Y Baby Dress
                    <br>
                    Rs. ${price2}
                </button>

            </div>


            <div class="option-title">
                Quantity
            </div>


            <div class="quantity-box">

                <button
                    class="quantity-button"
                    onclick="changeQuantity(-1)"
                >
                    −
                </button>


                <span class="quantity-number">
                    ${selectedQuantity}
                </span>


                <button
                    class="quantity-button"
                    onclick="changeQuantity(1)"
                >
                    +
                </button>

            </div>


            <button
                class="add-cart-button"
                onclick="addCurrentProductToCart()"
            >
                Add to Cart 🛍️
            </button>

        </div>

    `;

}


/* =========================================================
   SELECT SIZE
========================================================= */

function selectSize(size) {

    selectedSize = size;

    renderProductPage();

}


/* =========================================================
   CHANGE QUANTITY
========================================================= */

function changeQuantity(change) {

    selectedQuantity += change;


    if (selectedQuantity < 1) {
        selectedQuantity = 1;
    }


    if (selectedQuantity > 20) {
        selectedQuantity = 20;
    }


    renderProductPage();

}


/* =========================================================
   ADD CURRENT PRODUCT TO CART
========================================================= */

function addCurrentProductToCart() {

    if (!currentProduct) {
        return;
    }


    const basePrice =
        selectedSize === "1Y"
            ? currentProduct.price1Y
            : currentProduct.price2Y;


    const discount =
        getDiscount(currentProduct);


    const salePrice =
        getSalePrice(
            basePrice,
            discount
        );


    const existing =
        cart.find(item =>
            item.productId === currentProduct.id &&
            item.size === selectedSize
        );


    if (existing) {

        existing.quantity +=
            selectedQuantity;

    } else {

        cart.push({

            productId:
                currentProduct.id,

            name:
                currentProduct.name,

            color:
                currentProduct.color,

            size:
                selectedSize,

            quantity:
                selectedQuantity,

            basePrice:
                basePrice,

            discount:
                discount,

            salePrice:
                salePrice

        });

    }


    updateCart();


    openCart();

}


/* =========================================================
   UPDATE CART
========================================================= */

function updateCart() {

    const cartItems =
        document.getElementById(
            "cartItems"
        );


    const cartCount =
        document.getElementById(
            "cartCount"
        );


    const cartTotal =
        document.getElementById(
            "cartTotal"
        );


    if (cart.length === 0) {

        cartItems.innerHTML = `

            <div class="empty-cart">
                Your cart is empty.
            </div>

        `;

        cartCount.textContent = "0";

        cartTotal.textContent =
            "Rs. 0";

        return;

    }


    let total = 0;

    let totalItems = 0;


    cartItems.innerHTML = "";


    cart.forEach((item, index) => {

        const itemTotal =
            item.salePrice *
            item.quantity;


        total += itemTotal;


        totalItems +=
            item.quantity;


        const div =
            document.createElement("div");


        div.className =
            "cart-item";


        div.innerHTML = `

            <h4>
                ${item.name}
            </h4>

            <p>
                Color: ${item.color}
            </p>

            <p>
                Size: ${item.size}
            </p>

            <p>
                Quantity: ${item.quantity}
            </p>

            <p>
                Discount: ${item.discount}%
            </p>

            <p class="cart-item-price">
                Rs. ${item.salePrice}
                ×
                ${item.quantity}
                =
                Rs. ${itemTotal}
            </p>

            <button
                class="remove-item"
                onclick="removeFromCart(${index})"
            >
                Remove
            </button>

        `;


        cartItems.appendChild(div);

    });


    cartCount.textContent =
        totalItems;


    cartTotal.textContent =
        "Rs. " + total;

}


/* =========================================================
   REMOVE CART ITEM
========================================================= */

function removeFromCart(index) {

    cart.splice(index, 1);

    updateCart();

}


/* =========================================================
   OPEN CART
========================================================= */

function openCart() {

    document
        .getElementById("cart")
        .classList.add("active");


    document
        .getElementById("cartOverlay")
        .classList.add("active");

}


/* =========================================================
   CLOSE CART
========================================================= */

function closeCart() {

    document
        .getElementById("cart")
        .classList.remove("active");


    document
        .getElementById("cartOverlay")
        .classList.remove("active");

}


/* =========================================================
   BACK TO COLLECTION
========================================================= */

function goBack() {

    /*
       If product page was opened through
       browser history, go back normally.
    */

    if (window.location.hash.startsWith("#product-")) {

        history.back();

    } else {

        showHome();

    }

}


/* =========================================================
   SHOW HOME
========================================================= */

function showHome() {

    document
        .getElementById("productPage")
        .classList.remove("active");


    document
        .getElementById("homePage")
        .style.display = "block";


    window.scrollTo(0, 0);

}


/* =========================================================
   BROWSER BACK BUTTON
========================================================= */

window.addEventListener(
    "popstate",
    function() {

        showHome();

    }
);


/* =========================================================
   WHATSAPP ORDER
========================================================= */

function orderOnWhatsApp() {

    if (cart.length === 0) {

        alert(
            "Your cart is empty."
        );

        return;

    }


    let message =
        "Hello KIDORA! 👋%0A%0A";


    message +=
        "I would like to place an order:%0A%0A";


    let total = 0;

    let totalItems = 0;

    let totalSaved = 0;


    cart.forEach((item, index) => {

        const itemTotal =
            item.salePrice *
            item.quantity;


        const itemSaving =
            (
                item.basePrice -
                item.salePrice
            ) *
            item.quantity;


        total += itemTotal;

        totalItems +=
            item.quantity;

        totalSaved +=
            itemSaving;


        message +=
            `${index + 1}. ${item.name}%0A`;


        message +=
            `Color: ${item.color}%0A`;


        message +=
            `Size: ${item.size}%0A`;


        message +=
            `Quantity: ${item.quantity}%0A`;


        message +=
            `Original Price: Rs. ${item.basePrice}%0A`;


        message +=
            `Discount: ${item.discount}%25%0A`;


        message +=
            `Sale Price: Rs. ${item.salePrice}%0A`;


        message +=
            `Saved: Rs. ${itemSaving}%0A`;


        message +=
            `Item Total: Rs. ${itemTotal}%0A%0A`;

    });


    message +=
        `Total Items: ${totalItems}%0A`;


    message +=
        `Total Saved: Rs. ${totalSaved}%0A`;


    message +=
        `Total: Rs. ${total}%0A%0A`;


    message +=
        "Please confirm my order. Thank you! 💗";


    const whatsappURL =
        `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;


    window.open(
        whatsappURL,
        "_blank"
    );

}


/* =========================================================
   START WEBSITE
========================================================= */

renderProducts();

updateCart();


/* =========================================================
   HANDLE PAGE OPENING WITH HASH
========================================================= */

window.addEventListener(
    "load",
    function() {

        const hash =
            window.location.hash;


        if (
            hash.startsWith(
                "#product-"
            )
        ) {

            const id =
                Number(
                    hash.replace(
                        "#product-",
                        ""
                    )
                );


            const product =
                PRODUCTS.find(
                    p => p.id === id
                );


            if (product) {

                currentProduct =
                    product;


                selectedSize =
                    "1Y";


                selectedQuantity =
                    1;


                renderProductPage();


                document
                    .getElementById(
                        "homePage"
                    )
                    .style.display =
                    "none";


                document
                    .getElementById(
                        "productPage"
                    )
                    .classList.add(
                        "active"
                    );

            }

        }

    }
);

</script>
